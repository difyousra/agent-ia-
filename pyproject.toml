[project]
name = "vendor-contract-agent"
version = "1.0.0"
description = "Agent unique d'analyse de contrat fournisseur"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "pypdf>=4.3.0",
  "python-dotenv>=1.0.1",
  "python-docx>=1.1.2",
  "streamlit>=1.38.0",
  "kagglehub>=0.3.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "python-multipart>=0.0.9",
  "chromadb>=0.5.0",
]

[project.scripts]
vendor-contract-agent = "vendor_contract_agent.cli:main"
vendor-contract-api = "vendor_contract_agent.api:create_app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vendor_contract_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
